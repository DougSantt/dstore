<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Formulário</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Criar uma conta</h2>
        </div>

        <form id="form" class="form">
            <div class="form-control">
                <label for="username">Nome de usuário:</label>
                <input type="text" id="username" placeholder="Digite seu nome de usuário..." />
                <i class="bi bi-exclamation-circle-fill"></i>
                <i class="bi bi-check-circle-fill"></i>
                <small>Mensagem de erro</small>
            </div>
            
            <div class="form-control">
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Digite seu email..." />
                <i class="bi bi-exclamation-circle-fill"></i>
                <i class="bi bi-check-circle-fill"></i>
                <small>Mensagem de erro</small>
            </div>

            <div class="form-control">
                <label for="password">Senha:</label>
                <input type="text" id="password" placeholder="Digite sua senha..." />
                <i class="bi bi-exclamation-circle-fill"></i>
                <i class="bi bi-check-circle-fill"></i>
                <small>Mensagem de erro</small>
            </div>

            <div class="form-control">
                <label for="password-confirmation">Confirmação de senha:</label>
                <input type="text" id="password-confirmation" placeholder="Confirmar senha..." />
                <i class="bi bi-exclamation-circle-fill"></i>
                <i class="bi bi-check-circle-fill"></i>
                <small>Mensagem de erro</small>
            </div>
            <button type="sudmit">Enviar</button>
        </form>
    </div>

</body>
</html>
