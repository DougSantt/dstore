<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Formulário</title>
</head>
<body>
<main>
    <div class="formHeader">
    <h2>Criar conta</h2>
    <button class="default">
            <i class="bi bi-box-arrow-in-right"></i>
    </button>

    <form action="" id="form">
        <div class="input-container">

            <div class="input-box">
                <label for="name" class="form-label">Nome:</label>
                <div class="input-field">
                    <input type="text" name="name" id="name" class="form-control" placeholder="Seu nome">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>

            <div class="input-box">
                <label for="last-name" class="form-label">Sobrenome:</label>
                <div class="input-field">
                    <input type="text" name="last-name" id="last-name" class="form-control" placeholder="Sobrenome">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>

             <div class="input-box">
                <label for="birthdate" class="form-label">Nascimento</label>
                <div class="input-field">
                    <input type="date" name="birthdate" id="birthdate" class="form-control">
                </div>
            </div>

             <div class="input-box">
                <label for="email" class="form-label">E-mail:</label>
                <div class="input-field">
                    <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu email...">
                    <i class="bi bi-envelope"></i>
                </div>
            </div>

            <div class="input-box">
                <label for="password" class="form-label">Senha:</label>
                <div class="input-field">
                    <input type="password" name="password" id="password" class="form-control" placeholder="*******">
                    <i class="bi bi-eye bi bi-eye-slash"></i>
                </div>
            </div>

        </div>

        </form>
    </div>
</main>
</body>
</html>
