<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Formulário</title>
</head>
<body>
<main id="form-container">
    <div class="formHeader">
        <h2 id="form-title">Criar conta</h2>
        <button class="btn-default">
            <i class="bi bi-box-arrow-in-right"></i>
        </button>
    </div>
    <form action="" id="form">
        <div class="input-container">
            <div class="input-box">
                <label for="name" class="form-label">Nome:</label>
                <div class="input-field">
                    <input type="text" name="name" id="name" class="form-control" placeholder="Seu nome">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>

            <div class="input-box">
                <label for="last-name" class="form-label">Sobrenome:</label>
                <div class="input-field">
                    <input type="text" name="last-name" id="last-name" class="form-control" placeholder="Sobrenome">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>

             <div class="input-box">
                <label for="birthdate" class="form-label">Nascimento</label>
                <div class="input-field">
                    <input type="date" name="birthdate" id="birthdate" class="form-control">
                </div>
            </div>

             <div class="input-box">
                <label for="email" class="form-label">E-mail:</label>
                <div class="input-field">
                    <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu email...">
                    <i class="bi bi-envelope"></i>
                </div>
            </div>

            <div class="input-box">
                <label for="password" class="form-label">Senha:</label>
                <div class="input-field">
                    <input type="password" name="password" id="password" class="form-control" placeholder="*******">
                    <i class=" bi bi-eye bi bi-eye-slash password-icon"></i>
                </div>
            </div>

            <div class="input-box">
                <label for="confirm-password" class="form-label">Confirmar Senha:</label>
                <div class="input-field">
                    <input type="confirm-password" name="confirm-password" id="confirm-password" class="form-control" placeholder="*******">
                    <i class="bi bi-eye bi bi-eye-slash password-icon"></i>
                </div>
            </div>

            <div class="input-box telephoneBox">
                <label for="telephone" class="form-label">Celular:</label>
                <div class="input-field">
                    <input type="tel" name="telephone" id="telephone" class="form-control" placeholder="Número">
                </div>
            </div>

            <div class="radio-container">
                <label class="form-label">Gênero</label>
                <div id="gender-inputs">
                    <div class="radio-box">
                        <input type="radio" name="gender" id="female" class="form-control" value="female">
                        <label for="female" class="form-label">Mulher</label>
                    </div>

                    <div class="radio-box">
                        <input type="radio" name="gender" id="male" class="form-control" value="male">
                        <label for="male" class="form-label">Homem</label>
                    </div>

                     <div class="radio-box">
                        <input type="radio" name="gender" id="other" class="form-control" value="other">
                        <label for="other" class="form-label">Outro</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-default">
                <i class="bi bi-check-lg"></i>
                Criar conta
            </button>

        </div>

    </form>
   
</main>
</body>
</html>
